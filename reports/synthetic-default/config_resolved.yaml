run_name: synthetic-default
seed: 42
data:
  source: synthetic
  raw_dir: data/raw
  ibm_trans_file: HI-Small_Trans.csv
  ibm_patterns_file: HI-Small_Patterns.txt
  synthetic:
    n_accounts: 12000
    n_banks: 25
    n_days: 150
    start_date: '2024-01-01'
    laundering_patterns: 260
    out_trans_file: SYNTH_Trans.csv
    out_patterns_file: SYNTH_Patterns.txt
rules:
  large_txn_usd: 10000.0
  structuring_low_usd: 8000.0
  structuring_high_usd: 10000.0
  structuring_min_count: 2
  fan_out_min_counterparties: 6
  fan_in_min_counterparties: 6
  spike_multiplier: 5.0
  spike_window_days: 14
  spike_min_usd: 2000.0
  high_risk_channel_min_usd: 3000.0
  high_risk_formats:
  - Cash
  - Bitcoin
  pass_through_min_in_usd: 3000.0
  pass_through_ratio: 0.8
labels:
  lookback_days: 0
  delay_median_days_pos: 14.0
  delay_median_days_neg: 3.0
  delay_sigma: 0.6
features:
  profile_windows_days:
  - 1
  - 3
  - 7
  - 14
  - 30
  graph:
    twl_days: 3
    tws_days: 30
    hub_degree_quantile: 0.99
  guilty_walker:
    n_walks: 50
    max_steps: 8
    illicit_memory_days: 21
  gwd:
    enabled: true
    pseudo_label_window_days: 14
    pseudo_label_threshold: 0.5
split:
  warmup_days: 30
  val_start_day: 95
  test_start_day: 115
  respect_label_delay: true
training:
  n_trials: 20
  timeout_seconds: 240
  feature_selection_importance_share: 0.95
  target_fpr: 0.2
  selection_min_gain: 0.01
augmentation:
  methods:
  - none
  - class_weight
  - smote
  - ctgan
  target_positive_share: 0.15
  select_ctgan_in_folds: false
  ctgan:
    epochs: 150
    batch_size: 500
    negatives_sample: 6000
evaluation:
  backtest:
    cuts:
    - 75
    - 95
    - 115
    - 130
    val_days: 20
    test_days: 20
    bootstrap_reps: 300
    seeds:
    - 1
    - 2
    - 3
    - 4
    - 5
    min_typology_positives: 15
  bootstrap_reps: 1000
  capacity_alerts_per_day: null
  feature_sets:
  - alert
  - alert+profiles
  - alert+profiles+degree
  - alert+profiles+degree+gw
  - alert+profiles+degree+gwd
policy:
  mode: suppress
  never_suppress_rules:
  - structuring
  override_prior_positive: true
  btl:
    strata:
    - lo_frac_of_tau: 0.5
      hi_frac_of_tau: 1.0
      rate: 0.1
    - lo_frac_of_tau: 0.0
      hi_frac_of_tau: 0.5
      rate: 0.02
paths:
  work_dir: data/work
  artifacts_dir: artifacts
  reports_dir: reports
