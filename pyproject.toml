[project]
name = "aml-triage"
version = "0.1.0"
description = "Alert triage model that suppresses / prioritises AML rule-engine alerts (Eddin et al. 2022 + Bakry et al. 2023), with leakage-safe graph features, GAN augmentation experiments, an API and an analyst UI."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=15",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "optuna>=3.6",
  "numba>=0.59",
  "pydantic>=2.6",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "matplotlib>=3.8",
  "imbalanced-learn>=0.12",
]

[project.optional-dependencies]
gan = ["ctgan>=0.10", "torch>=2.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
aml-triage = "aml_triage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
